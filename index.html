<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BETA AVIATOR.COM</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #080b12;
  color: white;
  min-height: 100vh;
}

header {
  background: #111722;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #263044;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.logo span {
  color: #ff3b30;
}

.balance {
  background: #1b2433;
  padding: 8px 14px;
  border-radius: 20px;
  color: #50fa7b;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.game {
  background: #0d121c;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #202b3d;
}

.game-screen {
  height: 390px;
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 40px 40px;
}

.multiplier {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 58px;
  font-weight: bold;
  color: #ff3b30;
}

.status {
  position: absolute;
  top: 15px;
  left: 15px;
  background: #151d2b;
  padding: 7px 12px;
  border-radius: 15px;
  font-size: 13px;
}

.plane {
  position: absolute;
  font-size: 45px;
  transition: all .15s linear;
}

.controls {
  padding: 18px;
  background: #111722;
}

.amount {
  width: 100%;
  padding: 14px;
  background: #080b12;
  color: white;
  border: 1px solid #303b4f;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 10px;
}

.buttons {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 15px;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.bet {
  background: #20c997;
  color: white;
}

.cashout {
  background: #ff3b30;
  color: white;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.players {
  margin-top: 15px;
  background: #111722;
  border-radius: 12px;
  padding: 15px;
}

.players h3 {
  margin-bottom: 12px;
}

.player {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid #202a3a;
  font-size: 14px;
}

.green {
  color: #50fa7b;
}

.red {
  color: #ff5252;
}

.notice {
  text-align: center;
  color: #8792a6;
  font-size: 12px;
  margin-top: 15px;
}
</style>
</head>

<body>

<header>
  <div class="logo">✈ BETA <span>AVIATOR</span></div>
  <div class="balance">
    KSh <span id="balance">5000.00</span>
  </div>
</header>

<div class="container">

  <div class="game">

    <div class="game-screen">

      <div class="status" id="status">
        Waiting for round...
      </div>

      <div class="multiplier" id="multiplier">
        1.00x
      </div>

      <div class="plane" id="plane">
        ✈️
      </div>

    </div>

    <div class="controls">

      <input
        id="amount"
        class="amount"
        type="number"
        value="100"
        min="10"
        placeholder="Demo bet amount"
      >

      <div class="buttons">

        <button
          id="betBtn"
          class="bet"
          onclick="placeBet()">
          BET
        </button>

        <button
          id="cashBtn"
          class="cashout"
          onclick="cashOut()"
          disabled>
          CASH OUT
        </button>

      </div>

    </div>
  </div>

  <div class="players">

    <h3>Live Players</h3>

    <div id="playersList"></div>

  </div>

  <div class="notice">
    DEMO VERSION — No real money is involved.
  </div>

</div>

<script>

let balance = 5000;
let multiplier = 1;
let crashPoint = 0;
let playing = false;
let betAmount = 0;
let hasBet = false;

const balanceEl = document.getElementById("balance");
const multiplierEl = document.getElementById("multiplier");
const statusEl = document.getElementById("status");
const planeEl = document.getElementById("plane");
const betBtn = document.getElementById("betBtn");
const cashBtn = document.getElementById("cashBtn");

function updateBalance() {
  balanceEl.textContent = balance.toFixed(2);
}

function newRound() {

  playing = false;
  multiplier = 1;
  hasBet = false;

  multiplierEl.textContent = "1.00x";
  multiplierEl.style.color = "#ff3b30";

  statusEl.textContent = "Waiting for round...";

  planeEl.style.left = "20px";
  planeEl.style.bottom = "25px";

  betBtn.disabled = false;
  cashBtn.disabled = true;

  setTimeout(startRound, 3000);
}

function startRound() {

  playing = true;

  crashPoint =
    (Math.random() * 5 + 1.2).toFixed(2);

  statusEl.textContent = "ROUND LIVE";

  let start = Date.now();

  function update() {

    if (!playing) return;

    let elapsed = (Date.now() - start) / 1000;

    multiplier =
      1 + elapsed * 0.25 + elapsed * elapsed * 0.035;

    multiplierEl.textContent =
      multiplier.toFixed(2) + "x";

    let progress =
      Math.min((multiplier / crashPoint) * 85, 85);

    planeEl.style.left =
      progress + "%";

    planeEl.style.bottom =
      (25 + progress * .45) + "%";

    if (multiplier >= crashPoint) {

      multiplier =
        parseFloat(crashPoint);

      multiplierEl.textContent =
        multiplier.toFixed(2) + "x";

      crash();

      return;
    }

    requestAnimationFrame(update);
  }

  requestAnimationFrame(update);
}

function placeBet() {

  if (playing) {
    alert("Wait for the next round to place a demo bet.");
    return;
  }

  let amount =
    parseFloat(document.getElementById("amount").value);

  if (!amount || amount < 10) {
    alert("Minimum demo bet is KSh 10.");
    return;
  }

  if (amount > balance) {
    alert("Insufficient demo balance.");
    return;
  }

  balance -= amount;
  updateBalance();

  betAmount = amount;
  hasBet = true;

  betBtn.disabled = true;
  cashBtn.disabled = false;

  statusEl.textContent =
    "Bet placed: KSh " + amount.toFixed(2);

  startRound();
}

function cashOut() {

  if (!hasBet || !playing) return;

  let winnings =
    betAmount * multiplier;

  balance += winnings;

  updateBalance();

  statusEl.textContent =
    "Cashed out at " +
    multiplier.toFixed(2) +
    "x — KSh " +
    winnings.toFixed(2);

  hasBet = false;
  cashBtn.disabled = true;
}

function crash() {

  playing = false;

  multiplierEl.style.color = "#ff5252";

  statusEl.textContent =
    "CRASHED at " +
    multiplier.toFixed(2) +
    "x";

  cashBtn.disabled = true;
  betBtn.disabled = false;

  if (hasBet) {
    hasBet = false;
  }

  setTimeout(newRound, 3000);
}


/* LIVE DEMO PLAYERS */

const names = [
  "Dragon254",
  "Kevin",
  "Brian",
  "Mercy",
  "Jay",
  "Amani",
  "Victor",
  "Diana",
  "Alex",
  "Mike"
];

function createPlayers() {

  let html = "";

  names.slice(0, 7).forEach(name => {

    let amount =
      Math.floor(Math.random() * 900) + 50;

    let multi =
      (Math.random() * 4 + 1.2).toFixed(2);

    html += `
      <div class="player">
        <span>${name}</span>
        <span class="green">
          KSh ${amount}
        </span>
        <span>
          ${multi}x
        </span>
      </div>
    `;

  });

  document.getElementById("playersList").innerHTML = html;
}

createPlayers();
newRound();

</script>

</body>
          </html>
