<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aviator – 12 Instructions</title>
  <style>
    :root {
      --bg: #0b0e11;
      --card: #161a1f;
      --accent: #e11d48;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header h1 span { color: var(--accent); }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      max-width: 1200px;
      margin: 0 auto;
      min-height: calc(100vh - 70px);
    }
    nav {
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 1.5rem 0;
      overflow-y: auto;
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--muted);
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    nav button:hover,
    nav button.active {
      background: #1e293b;
      color: white;
      border-left: 3px solid var(--accent);
    }
    nav button span {
      display: inline-block;
      width: 24px;
      color: var(--accent);
      font-weight: 600;
    }
    main {
      padding: 2rem 2.5rem;
      overflow-y: auto;
    }
    .section { display: none; animation: fade 0.25s ease; }
    .section.active { display: block; }
    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    h2 {
      font-size: 1.6rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    h2 .num {
      background: var(--accent);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
    }
    p, li { color: var(--muted); margin-bottom: 0.8rem; }
    ul { padding-left: 1.4rem; margin-bottom: 1.2rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem;
      margin-top: 1.2rem;
    }
    .tip {
      border-left: 4px solid var(--accent);
      padding-left: 1rem;
      margin: 1.2rem 0;
      color: #fca5a5;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      nav {
        display: flex;
        overflow-x: auto;
        padding: 0.5rem;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      nav button {
        white-space: nowrap;
        padding: 0.6rem 1rem;
        border-left: none !important;
        border-bottom: 3px solid transparent;
      }
      nav button.active { border-bottom-color: var(--accent); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Aviator <span>Instructions</span></h1>
    <div style="font-size:0.9rem;color:var(--muted)">12 Sections</div>
  </header>

  <div class="layout">
    <nav id="nav"></nav>
    <main id="content"></main>
  </div>

  <footer>
    Play responsibly • 18+ only • This is an informational demo
  </footer>

  <script>
    // ========== DATA FOR ALL 12 SECTIONS ==========
    const sections = [
      {
        id: 1,
        title: "Registration",
        content: `
          <p>Create your account in a few simple steps:</p>
          <ul>
            <li>Enter a valid email address and choose a strong password.</li>
            <li>Confirm your email via the link we send you.</li>
            <li>Accept the Terms of Service and Privacy Policy.</li>
            <li>Optionally enable 2-Factor Authentication during signup.</li>
          </ul>
          <div class="tip">Never share your password or verification codes with anyone.</div>
        `
      },
      {
        id: 2,
        title: "Login",
        content: `
          <p>Access your account securely:</p>
          <ul>
            <li>Use your registered email + password.</li>
            <li>If 2FA is enabled, enter the code from your authenticator app.</li>
            <li>Use “Forgot password” to reset via email if needed.</li>
            <li>Sessions expire after a period of inactivity for security.</li>
          </ul>
        `
      },
      {
        id: 3,
        title: "Profile",
        content: `
          <p>Manage your personal information:</p>
          <ul>
            <li>Update display name, avatar and contact details.</li>
            <li>View account creation date and last login.</li>
            <li>Change password and manage linked devices.</li>
            <li>Set preferred language and notification preferences.</li>
          </ul>
        `
      },
      {
        id: 4,
        title: "Identity verification",
        content: `
          <p>Complete KYC to unlock higher limits and withdrawals:</p>
          <ul>
            <li>Upload a government-issued ID (passport, national ID or driver’s license).</li>
            <li>Take a live selfie for face matching.</li>
            <li>Provide proof of address if requested.</li>
            <li>Verification usually takes a few minutes to 24 hours.</li>
          </ul>
          <div class="tip">All documents are encrypted and processed securely.</div>
        `
      },
      {
        id: 5,
        title: "Virtual wallet",
        content: `
          <p>Your in-game balance and transaction center:</p>
          <ul>
            <li>View current balance and pending transactions.</li>
            <li>Deposit via supported payment methods.</li>
            <li>Withdraw to your verified bank or crypto wallet.</li>
            <li>See full transaction history with filters.</li>
          </ul>
        `
      },
      {
        id: 6,
        title: "Game area with airplane + graph + voice",
        content: `
          <p>The main play screen contains three key elements:</p>
          <ul>
            <li><strong>Airplane</strong> – flies upward while the multiplier increases.</li>
            <li><strong>Live graph</strong> – shows the current multiplier in real time.</li>
            <li><strong>Voice / sound</strong> – announces key moments and can be muted.</li>
          </ul>
          <div class="card">
            <p><strong>How to play:</strong></p>
            <ol>
              <li>Place your bet before the round starts.</li>
              <li>Watch the airplane take off and the multiplier rise.</li>
              <li>Cash out before the airplane flies away to lock in your win.</li>
              <li>If the plane disappears before you cash out, the bet is lost.</li>
            </ol>
          </div>
        `
      },
      {
        id: 7,
        title: "Game history",
        content: `
          <p>Review past rounds and your personal results:</p>
          <ul>
            <li>See the last 50–100 crash points.</li>
            <li>Filter by date or by your own bets only.</li>
            <li>View detailed bet information (amount, cash-out multiplier, profit/loss).</li>
            <li>Export history if needed for personal records.</li>
          </ul>
        `
      },
      {
        id: 8,
        title: "Notifications",
        content: `
          <p>Stay informed about important events:</p>
          <ul>
            <li>Deposit / withdrawal confirmations.</li>
            <li>Promotion and bonus alerts.</li>
            <li>Security alerts (new login, password change).</li>
            <li>You can turn categories on/off in Profile → Notifications.</li>
          </ul>
        `
      },
      {
        id: 9,
        title: "Security",
        content: `
          <p>Protect your account with these tools:</p>
          <ul>
            <li>Enable 2-Factor Authentication (recommended).</li>
            <li>Review active sessions and log out remotely.</li>
            <li>Set a withdrawal lock / cool-down period.</li>
            <li>Change password regularly and never reuse it on other sites.</li>
          </ul>
          <div class="tip">We will never ask for your password or 2FA codes via email or chat.</div>
        `
      },
      {
        id: 10,
        title: "Responsible-use controls",
        content: `
          <p>Tools to help you stay in control:</p>
          <ul>
            <li>Set daily / weekly deposit limits.</li>
            <li>Set loss limits and session time limits.</li>
            <li>Self-exclude for a chosen period (24 h – permanent).</li>
            <li>Reality-check pop-ups that remind you how long you’ve been playing.</li>
          </ul>
          <div class="tip">If you feel you need help, contact support or visit a responsible-gambling organization.</div>
        `
      },
      {
        id: 11,
        title: "Support",
        content: `
          <p>We’re here to help 24/7:</p>
          <ul>
            <li>Live chat (fastest response).</li>
            <li>Email support with ticket tracking.</li>
            <li>FAQ and knowledge base.</li>
            <li>Phone support in selected regions.</li>
          </ul>
        `
      },
      {
        id: 12,
        title: "Financial functions notice",
        content: `
          <p>Important legal and financial information:</p>
          <ul>
            <li>All funds are held in segregated accounts where required by law.</li>
            <li>Deposits and withdrawals are subject to verification and processing times.</li>
            <li>Currency conversion fees may apply.</li>
            <li>We are licensed and regulated. Please play only if it is legal in your jurisdiction.</li>
            <li>Gambling involves risk. Never bet more than you can afford to lose.</li>
          </ul>
          <div class="card">
            <p>By using this platform you confirm that you are of legal age and that online gambling is permitted in your location.</p>
          </div>
        `
      }
    ];

    // ========== RENDER NAVIGATION ==========
    const nav = document.getElementById('nav');
    sections.forEach(s => {
      const btn = document.createElement('button');
      btn.innerHTML = `<span>${s.id}</span> ${s.title}`;
      btn.dataset.id = s.id;
      btn.addEventListener('click', () => showSection(s.id));
      nav.appendChild(btn);
    });

    // ========== RENDER CONTENT ==========
    const content = document.getElementById('content');
    sections.forEach(s => {
      const div = document.createElement('div');
      div.className = 'section';
      div.id = `section-${s.id}`;
      div.innerHTML = `
        <h2><span class="num">${s.id}</span> ${s.title}</h2>
        ${s.content}
      `;
      content.appendChild(div);
    });

    // ========== SHOW SECTION ==========
    function showSection(id) {
      document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));

      document.getElementById(`section-${id}`).classList.add('active');
      document.querySelector(`nav button[data-id="${id}"]`).classList.add('active');

      // Update URL hash without scrolling
      history.replaceState(null, null, `#${id}`);
    }

    // ========== INITIAL LOAD ==========
    const hash = parseInt(location.hash.slice(1));
    showSection(hash >= 1 && hash <= 12 ? hash : 1);
  </script>
</body>
</html>
